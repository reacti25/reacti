name: reacti_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.9+10

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_animated: ^3.2.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  get_storage: ^2.1.1
  provider: ^6.1.5+1
  dio: ^5.9.0
  get_it: ^9.2.1
  device_info_plus: ^13.0.0
  intl: ^0.20.2
  rxdart: ^0.28.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^6.0.2
  slide_countdown: ^2.0.2
  flutter_widget_from_html: ^0.17.1
  flutter_contacts: ^2.0.2
  permission_handler: ^12.0.1
  dropdown_button2: ^3.0.0
  smooth_page_indicator: ^2.0.1
  dart_pusher_channels: ^1.2.3
  camera: ^0.12.0+1
  image_picker: ^1.2.0
  video_player: ^2.10.1
  flick_video_player: ^0.9.0
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^21.0.0
  flutter_slidable: ^4.0.3
  swipe_to: ^1.0.6
  logger: ^2.7.0


dev_dependencies:
  dependency_validator: ^5.0.2
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.5.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80


  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins_Regular.ttf

