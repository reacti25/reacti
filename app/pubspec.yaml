name: reacti_app
description: "A new Flutter project."

publish_to: 'none' 

version: 1.3.2+16

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_animated: ^3.2.0
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  get_storage: ^2.1.1
  provider: ^6.1.5+1
  dio: ^5.9.0
  get_it: ^9.2.1
  # Pinned to 11.x: the 12.x/13.x releases call NSProcessInfo's
  # iOS-17 selector `isiOSAppOnVision` unguarded, which breaks the
  # iOS build for our iOS-13.0 deployment target. Bump to ^13 if/when
  # we raise the iOS minimum to 17.
  device_info_plus: ^11.0.0
  # SHA-256 hashing of the user id into a pseudonymous analytics distinct_id
  # (already resolved transitively; promoted to a direct dependency).
  crypto: ^3.0.6
  intl: ^0.20.2
  rxdart: ^0.28.0
  flutter_svg: ^2.2.3
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  pinput: ^6.0.2
  slide_countdown: ^2.0.2
  flutter_widget_from_html: ^0.17.1
  flutter_contacts: ^2.0.2
  permission_handler: ^12.0.1
  dropdown_button2: ^3.0.0
  smooth_page_indicator: ^2.0.1
  dart_pusher_channels: ^1.2.3
  camera: ^0.12.0+1
  image_picker: ^1.2.0
  wechat_assets_picker: ^9.5.0
  # Reads the running app version/build so analytics events carry the release
  # (already resolved transitively via the PostHog SDK; pin it as a direct dep).
  package_info_plus: ^9.0.1
  video_player: ^2.10.1
  flick_video_player: ^0.9.0
  # Compresses videos on send (≈720p H.264) so recipients get fast, freeze-free
  # playback instead of streaming a raw full-resolution upload.
  video_compress: ^3.1.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^21.0.0
  swipe_to: ^1.0.6
  logger: ^2.7.0
  flutter_secure_storage: ^10.3.1
  sentry_flutter: ^8.14.2
  posthog_flutter: ^5.27.0
  # Pinned to 6.x: 7.x's iOS code calls NWPath.isUltraConstrained (iOS 26 SDK),
  # which fails to compile on the current CI Xcode. 6.x exposes the same
  # List<ConnectivityResult> API we use. Revisit when CI moves to Xcode 26.
  connectivity_plus: ^6.1.0
  native_dio_adapter: 1.4.0
  flutter_image_compress: ^2.4.0
  # App-icon unread badge. Uses the iOS 16 UNUserNotificationCenter.setBadgeCount
  # API (matches the Podfile's iOS 16 platform), avoiding the deprecated
  # applicationIconBadgeNumber path.
  app_badge_plus: ^1.2.3
  audioplayers: ^6.7.1


dev_dependencies:
  dependency_validator: ^5.0.2
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.5.0
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  video_player_platform_interface: ^6.7.0
  plugin_platform_interface: ^2.1.8

flutter_gen:
  output: lib/gen/
  line_length: 80


  colors:
    inputs:
      - assets/color/colors.xml
    outputs:
      class_name: AppColors


flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/sounds/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins_Regular.ttf

