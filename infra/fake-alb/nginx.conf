# Stand-in for the AWS ALB (+ CloudFront for media) in compose.aws.yaml.
# Does what the real one does to our traffic: terminates TLS, speaks
# HTTP/1.1 to targets, appends X-Forwarded-For/Proto/Port, routes by host,
# passes websocket upgrades, idle timeout 300 s. Nothing app-specific.
events {}

http {
  # Docker's DNS, re-resolved so `web` round-robins across its replicas.
  resolver 127.0.0.11 valid=5s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  access_log /dev/stdout;
  error_log  /dev/stderr warn;
  client_max_body_size 128m;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port 443;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # API: default target group (two web tasks).
  server {
    listen 443 ssl;
    http2 on;
    server_name api.reacti.test;
    location / {
      set $web web;
      proxy_pass http://$web:8080;
    }
  }

  # Websockets: the reverb target group.
  server {
    listen 443 ssl;
    server_name ws.reacti.test;
    location / {
      set $reverb reverb;
      proxy_pass http://$reverb:8080;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }

  # Media: CloudFront in front of the private bucket (path-style here).
  server {
    listen 443 ssl;
    http2 on;
    server_name media.reacti.test;
    location / {
      set $rustfs rustfs;
      # Path-style: the Host must be the S3 endpoint, not our media hostname,
      # or the server reads "media" as a virtual-host bucket name.
      proxy_set_header Host rustfs:9000;
      proxy_pass http://$rustfs:9000/reacti-media/;
    }
  }
}
