name: Flutter CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-ci.yml'

# pubspec.yaml requires Dart SDK ^3.7.2 AND flutter_local_notifications ^21
# requires Dart ^3.10, so we need Flutter 3.35.x or newer.
env:
  FLUTTER_VERSION: '3.35.x'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Format check is intentionally skipped right now: the agency code is not
      # `dart format`-clean. Re-enable after a dedicated
      # "chore(app): dart format the entire app/" PR.

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --reporter expanded

  ios-build:
    name: iOS no-sign build
    runs-on: macos-14
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign --dart-define=BASE_URL=https://reacti.io/api --dart-define=APP_KEY_VALUE=ci-placeholder

  android-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze-and-test
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=BASE_URL=https://reacti.io/api --dart-define=APP_KEY_VALUE=ci-placeholder
