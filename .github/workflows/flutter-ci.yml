name: Flutter CI

# No `paths:` filter. The job below is a required status check; a path
# filter would leave it unreported on backend-only PRs, blocking the
# merge until an admin override. Running it on every PR keeps the check
# always-reporting without that workaround.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Nightly full-suite run on the default branch (develop): analyze, format,
  # tests and the Android/iOS build jobs run every day even with no commits,
  # catching flaky tests, env drift and toolchain rot early. 02:30 UTC.
  schedule:
    - cron: '30 2 * * *'

# Flutter 3.44 / Dart 3.12. Raised from 3.41 so pro_image_editor 13.x (which
# needs Dart >= 3.12) can be adopted for video editing; 3.44.6 is the current
# stable. We deliberately pin only the minor, so future patch releases don't
# break CI. Keep this in step with the other workflows and with local dev.
env:
  FLUTTER_VERSION: '3.44.x'

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format check
        # Fails if any file is not `dart format`-clean; run
        # `dart format .` locally to fix.
        run: dart format --set-exit-if-changed --output=none .

      - name: Static analysis
        run: flutter analyze --no-pub

      - name: Run tests with coverage
        run: flutter test --reporter expanded --coverage

      - name: Enforce coverage floor
        # A deliberately LOW floor (ratchet it up as screen tests are added).
        # The rx_*/logic/model layers are well covered; the untested full
        # screens pull the overall line number down. This only fails CI if
        # coverage REGRESSES below the floor, so it can never silently rot.
        run: |
          pct=$(awk -F: '/^LF:/{f+=$2} /^LH:/{h+=$2} END{if(f==0){print "0"}else{printf "%.1f", (h/f)*100}}' coverage/lcov.info)
          floor=35
          echo "App line coverage: ${pct}% (floor ${floor}%)"
          awk -v p="$pct" -v fl="$floor" 'BEGIN{exit !((p+0) >= (fl+0))}' \
            || { echo "::error::App line coverage ${pct}% is below the ${floor}% floor"; exit 1; }

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-coverage
          path: app/coverage/lcov.info
          if-no-files-found: warn

  # Android RELEASE build: catches compile/Gradle breaks and, unlike a debug
  # build, runs R8 shrinking, which is where release-only plugin crashes come
  # from. Also pins the permissions the finished app asks for. NOT a required
  # check yet; promote once reliably green.
  # (docs/PLAN-android-and-play-store-2026-09-28.md, Step 1.)
  build-android:
    name: Build Android (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # build.gradle.kts pins ndkVersion 29.x; Gradle auto-installs it
      # but only if the SDK licenses are accepted on the runner.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # Until the upload key lands (plan Step 4), build.gradle.kts signs release
      # with the debug key, so this needs no secrets.
      - name: Build release APK
        run: flutter build apk --release

      # Plugins merge their own permissions into the app at build time, so the
      # source AndroidManifest.xml is not the truth; the built APK is. Diff it
      # against the checked-in list so any added or dropped permission is a
      # visible, reviewed change. To accept a change, copy the "+" lines into
      # android/permissions.allowlist.
      - name: Check merged permissions
        run: |
          aapt2="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -n 1)aapt2"
          "$aapt2" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | grep -v '^package:' | sort > /tmp/permissions.txt
          diff -u android/permissions.allowlist /tmp/permissions.txt \
            || { echo "::error::App permissions changed; review, then update app/android/permissions.allowlist"; exit 1; }
          # CAMERA implies a *required* camera unless declared optional, and
          # Play then hides the app from camera-less devices (plan Step 3).
          "$aapt2" dump badging build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "uses-feature-not-required: name='android.hardware.camera'" \
            || { echo "::error::android.hardware.camera must be declared required=false"; exit 1; }
          # The status-bar silhouette must survive release resource shrinking,
          # or background pushes fall back to a white blob (plan Step 6).
          "$aapt2" dump resources build/app/outputs/flutter-apk/app-release.apk \
            | grep -q "drawable/ic_notification" \
            || { echo "::error::drawable/ic_notification missing from the release APK"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  # Installs the release APK on an emulator and fails on a launch crash (native
  # or uncaught Dart). See .github/scripts/android_smoke.sh. NOT required yet:
  # emulators can be flaky, so it is observed for a week first.
  smoke-android:
    name: Android launch smoke
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk

      # Hardware acceleration for the emulator; without it boot takes ~10x
      # longer on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/scripts/android_smoke.sh app-release.apk com.reacti.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            smoke.png
            logcat.txt
          if-no-files-found: warn

  # iOS compile-verification — catches iOS-side compile breaks that
  # neither analyze+test nor the Android build can see (e.g. plugins
  # referencing iOS-only APIs, Pod resolution issues, the package
  # rename leaking into Info.plist, etc.). NOT a required check yet —
  # promote once reliably green.
  #
  # `--no-codesign` lets the job run without a signing cert/profile,
  # so this stage needs zero secrets. The signed build that uploads
  # to TestFlight is a separate workflow (see ios-release.yml).
  #
  # macos-15 ships Xcode 16, which has the iOS-18 SDKs that
  # flutter_contacts / camera_avfoundation reference (the earlier
  # macos-14 image did not, which is why this job was disabled).
  build-ios:
    name: Build iOS (no-codesign)
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build IPA (no-codesign)
        run: flutter build ipa --release --no-codesign
