name: Backend Deploy

# Deploys the Laravel backend (backend/ subfolder of the monorepo) to the
# Hostinger VPS at reacti.io.
#
# Architecture: GitHub Actions runs composer install + npm build on a fresh
# ubuntu-latest runner, then rsyncs the prepared backend/ tree over SSH to
# /home/reacti/htdocs/reacti.io/ on the VPS, then SSHes in to run migrations,
# rebuild caches, restart queue workers, and reload php-fpm.
#
# The VPS runs Ubuntu 24.04 + CloudPanel; the site user is `reacti`. We SSH in
# as root and chown back to reacti:reacti at the end so CloudPanel's nginx and
# php-fpm (running as reacti) can read everything.
#
# Trigger:
#   - push to main, OR manual workflow_dispatch
#   - the 'production' Environment forces a required-reviewer approval gate
#
# Required GitHub secrets:
#   DEPLOY_SSH_HOST          e.g. 72.61.202.136
#   DEPLOY_SSH_PORT          22
#   DEPLOY_SSH_USER          root
#   DEPLOY_SSH_PRIVATE_KEY   contents of ed25519 private key (no passphrase)
#
# Required GitHub Environment 'production' with Achia as required reviewer.
#
# See docs/hostinger-deploy-setup.md for the full one-time setup walkthrough.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue concurrent deploys (don't cancel in-flight — mid-rsync abort would
# leave the server half-updated). Newer commits wait for the current deploy
# to finish, then run.
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, ship, migrate
    runs-on: ubuntu-latest
    environment: production  # Required-reviewer gate is enforced here.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, redis, gd, exif, openssl, tokenizer, xml
          tools: composer:v2
          coverage: none

      - name: Setup Node (for Vite asset build)
        uses: actions/setup-node@v4
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install PHP dependencies (production)
        # `composer install` (not `update`) for reproducible deploys: ships the
        # exact versions pinned in composer.lock. The lock is in sync with
        # composer.json (verified via `composer validate --check-lock`).
        run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

      - name: Install Node dependencies
        # `npm install` (not `npm ci`): the committed package-lock.json omits the
        # Node-22/npm-10 resolutions of the optional native deps bufferutil@4.1.0
        # and utf-8-validate@6.0.6 that this runner (Node 22 / npm 10) requires,
        # so `npm ci` fails here. The lock can only be regenerated correctly in a
        # Node-22/npm-10 environment — npm 11 drops these entries. Until that
        # relock lands, `npm install` resolves them at deploy time.
        # (composer uses the stricter `composer install` above — its lock IS in sync.)
        run: npm install --no-audit --no-fund --no-progress

      - name: Build frontend assets (Vite)
        run: npm run build

      - name: Strip non-production files before deploy
        # Keep the rsync payload lean and avoid shipping test/lint/CI config
        # to a public-facing server.
        run: |
          rm -rf tests/
          rm -f .env.example .env.backup .env.production \
                phpunit.xml phpunit-smoke.xml \
                phpstan.neon phpstan-baseline.neon pint.json \
                .phpunit.result.cache

      - name: Configure SSH for deploy
        # Write the private key to the runner with safe permissions, and
        # prime known_hosts so the first connection doesn't prompt.
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEPLOY_SSH_PORT }}" -H "${{ secrets.DEPLOY_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          
      - name: Rsync backend to VPS
        # --archive       preserves perms, timestamps, recurses
        # --compress      speeds up over WAN
        # --delete-after  removes server files not present in source, AFTER
        #                 the new files are in place (atomic-ish)
        # --exclude=*     protects server-side state (env, storage, uploads)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          rsync -avz --delete-after \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o StrictHostKeyChecking=accept-new" \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='public/uploads' \
            --exclude='public/hot' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --exclude='*.log' \
            --exclude='auth.json' \
            ./ "${SSH_USER}@${SSH_HOST}:/home/reacti/htdocs/reacti.io/"

      - name: Sync production analytics env vars into the prod .env
        # rsync excludes .env (server-side state), so write the analytics/Sentry
        # vars into the prod server's .env from GitHub secrets — idempotently, and
        # BEFORE the post-deploy config:cache below bakes them in. Mirrors the
        # staging-deploy analytics sync. Tagged ANALYTICS_ENV=production (same
        # single PostHog project + shared Sentry as staging, separated by the
        # analytics_env tag). DISTINCT prod salt (ANALYTICS_HASH_SALT_PROD) so prod
        # ids aren't linkable to staging ids. Default-OFF if POSTHOG_KEY is ever
        # empty (NullTransport). Behind the job's `environment: production`
        # approval gate, so it only runs on an approved prod deploy.
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ANALYTICS_ENV: production
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://eu.i.posthog.com
          SENTRY_LARAVEL_DSN: ${{ secrets.SENTRY_DSN_BACKEND }}
          SENTRY_TRACES_SAMPLE_RATE: '0.1'
          ANALYTICS_SAMPLE_RATE: '1.0'
          ANALYTICS_HASH_SALT: ${{ secrets.ANALYTICS_HASH_SALT_PROD }}
        run: |
          # Build the block locally from secrets (GitHub masks them in logs),
          # ship it, then upsert each key into the server .env.
          umask 077
          printf '%s\n' \
            "ANALYTICS_ENV=${ANALYTICS_ENV}" \
            "POSTHOG_KEY=${POSTHOG_KEY}" \
            "POSTHOG_HOST=${POSTHOG_HOST}" \
            "SENTRY_LARAVEL_DSN=${SENTRY_LARAVEL_DSN}" \
            "SENTRY_TRACES_SAMPLE_RATE=${SENTRY_TRACES_SAMPLE_RATE}" \
            "ANALYTICS_SAMPLE_RATE=${ANALYTICS_SAMPLE_RATE}" \
            "ANALYTICS_HASH_SALT=${ANALYTICS_HASH_SALT}" > "$RUNNER_TEMP/analytics.env"

          scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/analytics.env" "${SSH_USER}@${SSH_HOST}:/tmp/reacti-analytics.env"

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/reacti/htdocs/reacti.io
          touch .env
          # Idempotent upsert: drop any existing line for each key, then append.
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            key="${line%%=*}"
            grep -v "^${key}=" .env > .env.next || true
            mv .env.next .env
            printf '%s\n' "$line" >> .env
          done < /tmp/reacti-analytics.env
          rm -f /tmp/reacti-analytics.env
          echo "Production analytics env synced into prod .env."
          REMOTE

          rm -f "$RUNNER_TEMP/analytics.env"

      - name: Post-deploy on server (migrate, cache, queue, ownership, php-fpm reload)
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o StrictHostKeyChecking=accept-new \
              "${SSH_USER}@${SSH_HOST}" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /home/reacti/htdocs/reacti.io

          echo "--- Running migrations ---"
          php artisan migrate --force --ansi

          echo "--- Clearing then rebuilding Laravel caches ---"
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          php artisan event:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          echo "--- Signalling queue workers to restart ---"
          php artisan queue:restart

          echo "--- Restoring site-user ownership (rsync ran as root) ---"
          chown -R reacti:reacti /home/reacti/htdocs/reacti.io
          chmod -R ug+rwX /home/reacti/htdocs/reacti.io/storage \
                          /home/reacti/htdocs/reacti.io/bootstrap/cache

          echo "--- Reloading PHP-FPM to flush OPcache ---"
          for v in 8.3 8.2 8.1 8.0; do
            if systemctl is-active --quiet "php${v}-fpm"; then
              systemctl reload "php${v}-fpm"
              echo "Reloaded php${v}-fpm"
              break
            fi
          done

          echo "--- Deploy complete at $(date -u +%FT%TZ) ---"
          REMOTE

      - name: Clean up SSH key from runner
        if: always()
        run: shred -u ~/.ssh/deploy_key 2>/dev/null || rm -f ~/.ssh/deploy_key
