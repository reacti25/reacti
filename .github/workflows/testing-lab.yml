name: Testing lab

# The real app on an Android emulator and an iPhone simulator, each against
# its own throwaway test server, walking through the app's journeys
# (docs/PLAN-device-testing-2026-10-29.md). Mandatory: the "Testing lab"
# check is required on develop and main, and the merge gate
# (.claude/hooks/merge_gate.py) refuses any PR merge until it passed.
#
# Run it on demand on any branch, no PR needed:
#   gh workflow run testing-lab.yml --ref <branch>
#
# No `paths:` or branch filter: a required check must report on every PR. The
# "scope" job decides which phones run; on develop, main and nightly, always both.
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
  # Nightly on develop, catching flaky journeys and toolchain rot. 03:00 UTC.
  schedule:
    - cron: '0 3 * * *'

# A newer push to the same branch makes the older lab run moot.
concurrency:
  group: testing-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.x'

jobs:
  scope:
    name: Which phones
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.pick.outputs.android }}
      iphone: ${{ steps.pick.outputs.iphone }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # No PR, or no list from GitHub: an empty list means both phones.
        run: |
          { [ -z "$PR" ] || gh pr diff "$PR" --name-only || true; } |
            bash .github/scripts/lab_scope.sh | tee -a "$GITHUB_OUTPUT"

  # Each phone's journeys run as three shards side by side, each on its own
  # machine with its own test server (every journey sets up what it needs).
  # Shards end with the journeys that change the phone: app_lock leaves a
  # screen lock.
  android:
    name: Android (emulator, ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: chat
            journeys: signup patent_loop chat_journey message_actions media_send read_receipts
          - shard: people
            journeys: notification_tap profile_settings friends contacts social groups
          - shard: device
            journeys: screens first_run account call_guard invite_link offline app_lock
    steps:
      - uses: actions/checkout@v4

      # Some runners start too full for the emulator's system image ("No
      # space left on device"); drop toolchains the lab never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, gd, exif, openssl, tokenizer, xml
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Boot the test server
        run: bash .github/scripts/e2e_backend.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Gradle's downloads, kept between runs: the first build is the slow part.
          cache: gradle
          cache-dependency-path: app/android/**/*.gradle*

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the journeys on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          # A front lens and a microphone, as on a phone: the reaction recorder needs both.
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-front emulated -camera-back emulated
          script: bash .github/scripts/android_e2e.sh ${{ matrix.journeys }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-android-logs-${{ matrix.shard }}
          path: |
            lab-shots/
            e2e-*.log
            backend/storage/logs/*.log
          if-no-files-found: warn

  ios:
    name: iPhone (simulator, ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.iphone == 'true'
    # Same image as the TestFlight build, so the plugins compile the same way.
    runs-on: macos-26
    timeout-minutes: 120
    # As Android, without call_guard and invite_link (no calls or associated
    # domains on a simulator).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: chat
            journeys: signup patent_loop chat_journey message_actions media_send read_receipts
          - shard: people
            journeys: notification_tap profile_settings friends contacts social groups
          - shard: device
            journeys: screens first_run account offline app_lock
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, gd, exif, openssl, tokenizer, xml
          coverage: none
          tools: composer:v2

      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Boot the test server
        run: bash .github/scripts/e2e_backend.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      # Five minutes of each shard's first build went on Swift Package Manager.
      # The lab proves the journeys; the shipped native wiring (still on SPM)
      # is what the staging build proves.
      - name: Build plugins with CocoaPods only
        run: flutter config --no-enable-swift-package-manager

      # The native build between runs: without it, 15 minutes per shard. The
      # key follows what changes native code; Dart is recompiled anyway.
      - uses: actions/cache@v4
        with:
          path: |
            app/build
            app/ios/Pods
            ~/Library/Developer/Xcode/DerivedData
          key: lab-ios-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.lock', 'app/ios/Podfile.lock') }}
          restore-keys: lab-ios-${{ env.FLUTTER_VERSION }}-

      # Grants notification permission, which simctl cannot.
      - name: Install applesimutils
        run: brew tap wix/brew && brew trust --formula wix/brew/applesimutils && brew install applesimutils

      - name: Boot an iPhone simulator
        id: sim
        run: |
          # A hardware keyboard: no on-screen keyboard covering buttons.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool true
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # Skip the first-run "slide to type" keyboard screen.
          xcrun simctl spawn "$udid" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run the journeys on the simulator
        run: bash .github/scripts/ios_e2e.sh "${{ steps.sim.outputs.udid }}" ${{ matrix.journeys }}

      # What the simulator showed when it stopped, for a failed or stuck run.
      - name: Screenshot the simulator
        if: always()
        run: xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot lab-ios.png || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-ios-logs-${{ matrix.shard }}
          path: |
            lab-ios.png
            lab-shots/
            e2e-*.log
            backend/storage/logs/*.log
          if-no-files-found: warn

  # The one check branch protection and the merge gate look for.
  testing-lab:
    name: Testing lab
    needs: [scope, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate that enforces this check, tested where it is enforced.
      - name: Merge gate self-test
        run: python3 .claude/hooks/test_merge_gate.py

      - name: Which-phones self-test
        run: bash .github/scripts/lab_scope_check.sh

      # A phone may be missing only if scope chose to skip it: a failed scope
      # job leaves its answers empty, which fails here.
      - name: Both devices passed
        run: |
          echo "Android: ${{ needs.android.result }}, iPhone: ${{ needs.ios.result }}"
          passed() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          passed "${{ needs.android.result }}" "${{ needs.scope.outputs.android }}" &&
            passed "${{ needs.ios.result }}" "${{ needs.scope.outputs.iphone }}"
