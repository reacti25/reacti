name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      # Valid 32-byte base64 key (decoded: "ci-placeholder-key-32-bytes-test")
      APP_KEY: base64:Y2ktcGxhY2Vob2xkZXIta2V5LTMyLWJ5dGVzLXRlc3Q=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_DRIVER: null
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars-long-ok
      APP_KEY_VALUE: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, redis, gd, exif, openssl, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate composer.json (lenient — composer.lock was reconstructed)
        run: composer validate --no-check-publish --no-check-lock

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      # Use `update` (not `install`) until the dev team sends the original
      # composer.json and we regenerate composer.lock to match.
      - name: Resolve and install PHP dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # NOTE: not running `key:generate` because we don't commit a .env in CI;
      # APP_KEY is provided via the workflow env above.

      - name: Run migrations
        run: php artisan migrate --force --ansi

      - name: Run tests
        run: php artisan test --parallel --ansi

  # The Pint job is intentionally omitted right now: the agency code has 115
  # style issues across 187 files. Re-add it after we land a dedicated
  # "chore(backend): pint fix the entire backend" PR.
