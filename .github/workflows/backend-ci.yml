name: Backend CI

# No `paths:` filter. The job below is a required status check; a path
# filter would leave it unreported on app-only PRs, blocking the merge
# until an admin override. Running the (fast, in-memory sqlite) suite on
# every PR keeps the check always-reporting without that workaround.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: PHP Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      # Valid 32-byte base64 key (decoded: "ci-placeholder-key-32-bytes-test")
      APP_KEY: base64:Y2ktcGxhY2Vob2xkZXIta2V5LTMyLWJ5dGVzLXRlc3Q=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_DRIVER: null
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars-long-ok
      APP_KEY_VALUE: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, redis, gd, exif, openssl, tokenizer, xml
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json (lenient — composer.lock was reconstructed)
        run: composer validate --no-check-publish --no-check-lock

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      # Use `update` (not `install`) until the dev team sends the original
      # composer.json and we regenerate composer.lock to match.
      - name: Resolve and install PHP dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      # NOTE: not running `key:generate` because we don't commit a .env in CI;
      # APP_KEY is provided via the workflow env above.

      - name: Prepare storage and bootstrap directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      # vlucas/phpdotenv tries to read backend/.env at boot. The file is
      # not committed (CI uses workflow env: vars), and the warning escapes
      # the @-suppression once PHPUnit 11's error handler is in scope. An
      # empty file silences it without changing config resolution.
      - name: Create empty .env to silence dotenv warning
        run: touch .env

      - name: Static analysis (PHPStan / Larastan)
        # Fails only on errors not in phpstan-baseline.neon — i.e. new
        # violations introduced by this change. See backend/phpstan.neon.
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress --no-interaction

      - name: Run migrations
        run: php artisan migrate --force --ansi

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          php artisan test --ansi --display-warnings --coverage-clover=coverage/clover.xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/clover.xml
          if-no-files-found: warn

  # Composer security advisories. Audits composer.lock directly (no
  # install needed). This is NOT a required check: the agency-delivered
  # lockfile has pre-existing advisories that need a dependency-refresh
  # pass, so the job surfaces them without blocking merges. It turns
  # green once dependencies are updated.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: composer audit
        # --locked audits composer.lock directly; without it composer
        # has no installed project and skips the audit entirely.
        run: composer audit --locked

  # The Pint job is intentionally omitted right now: the agency code has 115
  # style issues across 187 files. Re-add it after we land a dedicated
  # "chore(backend): pint fix the entire backend" PR.
