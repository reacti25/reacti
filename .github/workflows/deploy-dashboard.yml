name: Deploy CI Dashboard

# Triggers, in order of intended cadence:
#   - workflow_run    fires after Backend CI / Flutter CI complete on the
#                     default branch (post-merge). This keeps the dashboard
#                     fresh in normal operation.
#   - push            on main and on the testing branch — ensures every
#                     push regenerates the data even before workflows have
#                     run, and lets us iterate on the dashboard itself
#                     without waiting for a CI cycle.
#   - workflow_dispatch  manual "Run workflow" button from the Actions tab.
on:
  workflow_run:
    workflows: [Backend CI, Flutter CI]
    types: [completed]
  push:
    branches: [main, feature/test-environment]
  workflow_dispatch:

# Permissions required:
#   actions: read   — for `gh run list` to enumerate CI runs.
#   contents: read  — to checkout the dashboard source.
permissions:
  actions: read
  contents: read

concurrency:
  group: cf-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x docs/dashboard/build.sh
          docs/dashboard/build.sh > docs/dashboard/data.json
          echo "Generated data.json with $(jq '.runs | length' docs/dashboard/data.json) runs"

      # Cloudflare Pages — free, supports private repos, identical look to
      # what we would have shipped on GitHub Pages. Requires two repo
      # secrets: CLOUDFLARE_API_TOKEN (with "Account · Cloudflare Pages ·
      # Edit" permission) and CLOUDFLARE_ACCOUNT_ID. See
      # docs/dashboard/README.md for the one-time setup steps.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dashboard --project-name=reacti-ci --branch=main
