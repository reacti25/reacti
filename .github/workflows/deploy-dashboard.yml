name: Deploy CI Dashboard

# Triggers, in order of intended cadence:
#   - workflow_run    fires after Backend CI / Flutter CI complete on the
#                     default branch (post-merge). Keeps the dashboard
#                     fresh in normal operation.
#   - push            on main and on the testing branch — ensures every
#                     push regenerates the data even before workflows have
#                     run, and lets us iterate on the dashboard itself
#                     without waiting for a CI cycle.
#   - workflow_dispatch  manual "Run workflow" button from the Actions tab.
on:
  workflow_run:
    workflows: [Backend CI, Flutter CI]
    types: [completed]
  push:
    branches: [main, feature/test-environment]
  workflow_dispatch:

# Permissions required:
#   actions: read     — for `gh run list` to enumerate CI runs.
#   contents: read    — to checkout the dashboard source.
#   pages: write + id-token: write  — GitHub Pages deployment via OIDC.
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time. Newer runs don't cancel in-flight ones.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate dashboard data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x docs/dashboard/build.sh
          docs/dashboard/build.sh > docs/dashboard/data.json
          echo "Generated data.json with $(jq '.runs | length' docs/dashboard/data.json) runs"

      # `enablement: true` lets the action enable GitHub Pages itself
      # the first time it runs (using the pages:write permission). Works
      # for public repos out of the box; private repos need a paid plan.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
