name: Container CI

# Builds backend/Dockerfile natively on amd64 and arm64, boots it, and gates
# on: /up and /healthcheck answer 200, required extensions and tools present,
# Trivy clean (CRITICAL/HIGH, fixed only), image size under 650 MB.
# AWS migration plan step 2.1.

on:
  push:
    branches: [aws-migration]
    paths:
      - 'backend/**'
      - '.github/workflows/container-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/container-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build & boot (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: reacti-backend:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Size ceiling (650 MB uncompressed)
        run: |
          size=$(docker image inspect reacti-backend:ci --format '{{.Size}}')
          echo "size: $((size / 1024 / 1024)) MB"
          test "$size" -le $((650 * 1024 * 1024))

      - name: Extensions, tools and files present
        run: |
          docker run --rm reacti-backend:ci php -m > mods.txt
          for ext in gd intl bcmath exif pdo_mysql opcache pcntl zip; do
            grep -qix "$ext" mods.txt || { echo "missing ext: $ext"; exit 1; }
          done
          docker run --rm reacti-backend:ci mysql --version
          docker run --rm reacti-backend:ci test -s /etc/ssl/rds/global-bundle.pem
          docker run --rm reacti-backend:ci test -s public/build/manifest.json
          docker run --rm reacti-backend:ci reacti php artisan --version
          docker run --rm reacti-backend:ci reacti php artisan schedule:list

      - name: Boot web and probe /up and /healthcheck
        run: |
          docker run -d --name web -p 8080:8080 \
            -e APP_ENV=production -e APP_DEBUG=false -e APP_URL=http://localhost:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e LOG_CHANNEL=stderr -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/ci.sqlite \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
            -e BROADCAST_CONNECTION=log -e MEDIA_DISK=local -e SERVED_BY=container-ci \
            reacti-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080/up; then ok=1; break; fi
            sleep 2
          done
          if [ -z "${ok:-}" ]; then echo "::error::/up never answered"; docker logs web; exit 1; fi
          curl -fsS -D - -o /dev/null http://localhost:8080/up | tr -d '\r' | grep -i '^x-reacti-origin: container-ci'
          curl -fsS http://localhost:8080/healthcheck
          docker logs web 2>&1 | tail -n 20

      - name: Trivy (CRITICAL/HIGH, fixed only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: reacti-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
