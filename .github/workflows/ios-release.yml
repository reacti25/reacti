name: iOS Release to TestFlight

# Triggered by a `v*` tag push (or manual workflow_dispatch). Builds a
# signed IPA on macos-15 and uploads it to TestFlight via the App
# Store Connect API. From TestFlight you can install on your iPhone
# and (when satisfied) promote to the App Store in one click.
#
# Inert until the six secrets listed in docs/ios-release-setup.md
# are populated — the build step still runs, but signing will fail
# loudly and the upload step is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.x'

jobs:
  release-ios:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Import the distribution certificate into an ephemeral keychain.
      # The base64-encoded .p12 export and its password come from
      # GitHub secrets — see docs/ios-release-setup.md step 2.
      - name: Install signing certificate
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$IOS_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "ci-keychain-pwd" "$KEYCHAIN" >/dev/null

      # Drop the .mobileprovision into the macOS location Xcode looks at.
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$PROFILE_DIR/reacti.mobileprovision"

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --export-options-plist=ios/ExportOptions.plist

      # Place the App Store Connect API key where `xcrun altool` /
      # `notarytool` look for it.
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_BASE64" | base64 --decode \
            > "$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Upload IPA to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reacti-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn
