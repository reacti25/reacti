name: iOS Release to TestFlight

# Triggered by a `v*` tag push (or manual workflow_dispatch). Builds a
# signed IPA on macos-15 and uploads it to TestFlight via the App
# Store Connect API. From TestFlight you can install on your iPhone
# and (when satisfied) promote to the App Store in one click.
#
# Inert until the six secrets listed in docs/ios-release-setup.md
# are populated — the build step still runs, but signing will fail
# loudly and the upload step is skipped.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.x'

jobs:
  release-ios:
    name: Build & Upload to TestFlight
    # Match the proven staging build environment (ios-testflight.yml).
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Import the distribution certificate into an ephemeral keychain.
      # Reuses the team-level Apple Distribution cert already used by the
      # staging build (ios-testflight.yml) — Apple Distribution certs are not
      # bundle-specific, so the same cert signs com.reacti.app.
      - name: Install signing certificate
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_CERT_P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$IOS_CERT_P12_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "ci-keychain-pwd" "$KEYCHAIN" >/dev/null

      # Drop the .mobileprovision into the macOS location Xcode looks at.
      # The production "Reacti App Store" profile for com.reacti.app, created
      # once via the App Store Connect API and stored as IOS_PROD_PROVISIONING_PROFILE.
      - name: Install provisioning profile
        env:
          IOS_PROD_PROVISIONING_PROFILE: ${{ secrets.IOS_PROD_PROVISIONING_PROFILE }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo "$IOS_PROD_PROVISIONING_PROFILE" | base64 --decode \
            > "$PROFILE_DIR/reacti.mobileprovision"

      # Apply manual Apple Distribution signing to the archive step, mirroring
      # how ios-testflight.yml signs staging. AppIdentity.xcconfig optionally
      # includes FlavorOverride.xcconfig (gitignored); for production we keep the
      # default com.reacti.app identity and only add distribution signing so the
      # archive is signed with the same cert + the "Reacti App Store" profile the
      # export then uses. Without this the archive falls back to the project's
      # development identity and fails (no development cert on the runner).
      - name: Configure manual distribution signing
        run: |
          cat > ios/Flutter/FlavorOverride.xcconfig <<'XCCONFIG'
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = 545264M5P7
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = Reacti App Store
          XCCONFIG
          echo "Active production signing override:"; cat ios/Flutter/FlavorOverride.xcconfig

      - name: Build signed IPA
        # Production analytics: events tagged ANALYTICS_ENV=production, flowing to
        # the same single PostHog project + shared Sentry as staging but separated
        # by the analytics_env tag (never mixed). A DISTINCT prod salt
        # (ANALYTICS_HASH_SALT_PROD) so prod hashed ids aren't linkable to staging
        # ids. Keys come from GitHub secrets (masked in logs). If any secret is
        # ever empty, AnalyticsConfig stays default-OFF (no behaviour change).
        env:
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          SENTRY_DSN_APP: ${{ secrets.SENTRY_DSN_APP }}
          ANALYTICS_HASH_SALT: ${{ secrets.ANALYTICS_HASH_SALT_PROD }}
        run: |
          flutter build ipa --release \
            --dart-define=ANALYTICS_ENV=production \
            --dart-define=POSTHOG_KEY=$POSTHOG_KEY \
            --dart-define=POSTHOG_HOST=https://eu.i.posthog.com \
            --dart-define=SENTRY_DSN=$SENTRY_DSN_APP \
            --dart-define=ANALYTICS_HASH_SALT=$ANALYTICS_HASH_SALT \
            --export-options-plist=ios/ExportOptions.plist

      # Place the App Store Connect API key where `xcrun altool` /
      # `notarytool` look for it.
      # Reuses the App Store Connect API key already used by staging. That
      # secret holds the raw .p8 contents (not base64), so write it verbatim —
      # mirrors ios-testflight.yml.
      - name: Install App Store Connect API key
        env:
          ASC_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_CONNECT_API_PRIVATE_KEY" \
            > "$KEY_DIR/AuthKey_${ASC_API_KEY_ID}.p8"

      - name: Upload IPA to TestFlight
        env:
          ASC_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reacti-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn
