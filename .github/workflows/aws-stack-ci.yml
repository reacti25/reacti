name: AWS stack CI

# Boots the production-shaped stack (infra/compose.aws.yaml) with the image
# from backend/Dockerfile and runs the websocket end-to-end smoke
# (infra/scripts/smoke_aws.py). AWS migration plan step 2.2.

on:
  push:
    branches: [aws-migration]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/aws-stack-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/aws-stack-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack:
    name: Compose stack + websocket smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: reacti-backend:ci
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Fake ALB certificate and hostnames
        run: |
          mkdir -p fake-alb/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
            -keyout fake-alb/certs/privkey.pem -out fake-alb/certs/fullchain.pem \
            -subj "/CN=reacti.test" \
            -addext "subjectAltName=DNS:api.reacti.test,DNS:ws.reacti.test,DNS:media.reacti.test"
          chmod 644 fake-alb/certs/*.pem
          echo "127.0.0.1 api.reacti.test ws.reacti.test media.reacti.test" | sudo tee -a /etc/hosts

      - name: Test media (a 40 MB "video" and a small reaction clip)
        # The API validates uploads by MIME sniffing (an ISO media `ftyp` box)
        # and caps them at 50 MB (SendChatMessageRequest). A real container
        # header plus random payload exercises the full upload path without
        # installing an encoder on the runner.
        run: |
          python3 - <<'EOF'
          import os
          hdr = b"\x00\x00\x00\x18ftypmp42\x00\x00\x00\x00mp42isom"
          for path, size in (("/tmp/smoke.mp4", 40 * 1024 * 1024), ("/tmp/reaction.mp4", 512 * 1024)):
              with open(path, "wb") as f:
                  f.write(hdr + os.urandom(size - len(hdr)))
          EOF
          file /tmp/smoke.mp4 /tmp/reaction.mp4
          ls -la /tmp/*.mp4

      - name: Start the stack
        run: docker compose -f compose.aws.yaml up -d --wait --wait-timeout 240

      - name: Smoke (API through the ALB, media through the bucket, events over the websocket)
        run: |
          pip install --quiet websockets==15.0.1
          python3 scripts/smoke_aws.py --ca fake-alb/certs/fullchain.pem --video /tmp/smoke.mp4 --reaction /tmp/reaction.mp4

      - name: Scheduler and queue state
        run: |
          docker compose -f compose.aws.yaml exec -T scheduler php artisan schedule:list | tee schedule.txt
          grep -q 'chat:prune-stale-staging' schedule.txt
          grep -q 'media:prune-orphans' schedule.txt
          pending=$(docker compose -f compose.aws.yaml exec -T mysql mysql -N -ureacti -preacti-ci reacti -e 'select count(*) from jobs')
          echo "jobs pending: $pending"; test "$pending" = "0"
          failed=$(docker compose -f compose.aws.yaml exec -T mysql mysql -N -ureacti -preacti-ci reacti -e 'select count(*) from failed_jobs')
          echo "jobs failed: $failed"; test "$failed" = "0"

      - name: Stack logs
        if: always()
        run: docker compose -f compose.aws.yaml logs --no-color --tail=150
