name: Post-deploy Smoke Tests

# Runs the HTTP smoke suite (backend/tests/Smoke/) against the live
# deployed backend. Triggered:
#   - manually via workflow_dispatch (you click "Run workflow")
#   - after "Staging Deploy" succeeds (workflow_run, develop) → staging URL
#   - after "Backend Deploy" succeeds (workflow_run, main)    → production URL
#
# B2 (docs/PLAN-testing-cicd-safety-2026-06-12.md): chain the smoke off the
# STAGING deploy so every commit landing on develop is validated end-to-end
# on staging — previously it only chained off the prod "Backend Deploy" and so
# never ran on staging. The base URL is selected from the triggering workflow.
#
# The suite asserts the load-bearing paths still work end-to-end:
# health-check, login, profile, combined chat list, friends list,
# group list, group inbox, and the patent-flow send→mark-viewed.
#
# Self-gating: the suite SKIPS (not fails) when SMOKE_* secrets are unset —
# the health check still runs, the login-dependent steps skip. Set the
# SMOKE_* secrets to the staging seed accounts (smoke-a/b@reacti.test) to
# activate the full staging validation. See docs/release-runbook.md and
# NEEDS-ACHIA.md. A RED post-deploy smoke blocks a promotion recommendation.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'API base URL (defaults to staging)'
        required: false
        default: 'https://staging.reacti.io/api'
  workflow_run:
    workflows: ["Staging Deploy", "Backend Deploy"]
    types: [completed]
    branches: [develop, main]

jobs:
  smoke:
    name: Smoke tests vs deployed backend
    runs-on: ubuntu-latest
    # Only run on a successful deploy (or manual dispatch). Skipping a failed
    # deploy's smoke run avoids reporting a misleading red against the live
    # API when the deploy itself never landed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: backend
    env:
      # Pick the target by trigger: manual dispatch input wins; otherwise the
      # "Staging Deploy" run targets staging and "Backend Deploy" targets prod.
      SMOKE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.base_url || (github.event.workflow_run.name == 'Staging Deploy' && 'https://staging.reacti.io/api' || 'https://reacti.io/api') }}
      SMOKE_USER_A_EMAIL: ${{ secrets.SMOKE_USER_A_EMAIL }}
      SMOKE_USER_A_PASSWORD: ${{ secrets.SMOKE_USER_A_PASSWORD }}
      SMOKE_USER_B_EMAIL: ${{ secrets.SMOKE_USER_B_EMAIL }}
      SMOKE_USER_B_PASSWORD: ${{ secrets.SMOKE_USER_B_PASSWORD }}
      SMOKE_GROUP_ID: ${{ secrets.SMOKE_GROUP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, redis, gd, openssl, tokenizer, xml
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Bootstrap storage dirs
        run: |
          mkdir -p storage/framework/cache/data \
                   storage/framework/sessions \
                   storage/framework/views \
                   storage/logs \
                   bootstrap/cache

      - name: Create empty .env (silences dotenv warning)
        run: touch .env

      - name: Run smoke suite
        run: php artisan test -c phpunit-smoke.xml --ansi
