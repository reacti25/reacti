name: Backwards Compatibility

# Plan A1 (docs/PLAN-testing-cicd-safety-2026-06-12.md) — staging-plan layer 3g.
#
# THE test that directly catches "a new backend breaks the OLD App Store app".
# The 2026-05-23 incident: a backend response-shape change the live (old) app
# could not parse → black chat screens. Staging was fine because the staging
# app is the NEW app. This workflow runs the live app's expected response
# shapes (frozen at the shipped build) against the CANDIDATE (develop/PR)
# backend, so a shape divergence the live app can't read fails here before it
# can reach prod.
#
# ──────────────────────────────────────────────────────────────────────────
#  ✅ ACTIVE (2026-06-13). The live App Store build is pinned as the annotated
#  tag `app-live-v1.0.9` (commit d064643 — the v1.0.9 production source import,
#  confirmed by Achia). prod ≠ main, so the tag points at the real shipped
#  source, not main HEAD.
#
#  Route: the A1 "lighter route" (no Flutter/iOS build in CI). The live app's
#  parse requirements are committed as frozen expectation schemas under
#  backend/tests/BackwardsCompat/live-app-v1.0.9/, derived field-by-field from
#  the pinned tag's Dart models. This job boots the candidate backend and runs
#  the BackwardsCompat PHPUnit suite, which replays those shapes against the
#  real endpoints.
#
#  To re-pin after the live app updates: move LIVE_APP_TAG, re-derive the
#  expectation schemas from the new models, update this comment.
#
#  🔒 GATE (operator): once green on ~5 develop PRs, add "Backwards
#  Compatibility" to the protect-main ruleset as a required status check.
# ──────────────────────────────────────────────────────────────────────────

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

env:
  # The pinned live App Store build these expectations are frozen against.
  # Kept in sync with BackwardsCompatTestCase::LIVE_APP_TAG.
  LIVE_APP_TAG: 'app-live-v1.0.9'

jobs:
  backwards-compat:
    name: Backwards Compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      # Valid 32-byte base64 key (decoded: "ci-placeholder-key-32-bytes-test")
      APP_KEY: base64:Y2ktcGxhY2Vob2xkZXIta2V5LTMyLWJ5dGVzLXRlc3Q=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BROADCAST_DRIVER: null
      JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars-long-ok
      APP_KEY_VALUE: ci-placeholder
    steps:
      # Check out FIRST — every `run:` step uses the job-default working
      # directory `backend/`, which does not exist until the repo is checked
      # out. We check out the candidate (the develop/PR backend under test),
      # NOT the live-app tag: the live app's requirements live in the committed
      # frozen schemas; the candidate backend is what we verify against them.
      - uses: actions/checkout@v4

      - name: Confirm the live-app tag is pinned
        # Defensive: if LIVE_APP_TAG is ever blanked back to a TODO placeholder,
        # fail loudly rather than silently skip the protection.
        run: |
          if [[ "${LIVE_APP_TAG}" == TODO* || -z "${LIVE_APP_TAG}" ]]; then
            echo "::error title=Backwards-compat not pinned::LIVE_APP_TAG is not set to a real tag. See NEEDS-ACHIA.md (A1)."
            exit 1
          fi
          echo "Live app pinned at: ${LIVE_APP_TAG}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, json, mbstring, pdo, pdo_sqlite, redis, gd, exif, openssl, tokenizer, xml
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}
          restore-keys: composer-

      # Use `update` (not `install`) until the dev team sends the original
      # composer.json and we regenerate composer.lock to match (mirrors backend-ci).
      - name: Resolve and install PHP dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Prepare storage and bootstrap directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/testing
          mkdir -p storage/framework/views
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      # vlucas/phpdotenv tries to read backend/.env at boot (not committed; CI
      # uses workflow env). An empty file silences the warning (mirrors backend-ci).
      - name: Create empty .env to silence dotenv warning
        run: touch .env

      - name: Run backwards-compatibility suite (live app vs candidate backend)
        run: php artisan test --testsuite=BackwardsCompat --ansi --display-warnings
