name: Secret scan

# Fails a PR whose commits add a secret (a key, token, password or private
# key), rule 19 of docs/RULES.md: .gitignore keeps the known secret files
# out, this catches the rest. Required on develop and main. Free: gitleaks
# needs no license on a personal account.
#
# No `paths:` or branch filter: a required check must report on every PR.
on:
  pull_request:

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The PR's own commits must be present for gitleaks to scan them.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
