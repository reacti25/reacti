name: iOS Staging to TestFlight

# On-demand only (Achia's decision 2026-05-30): start it from the Actions tab
# with "Run workflow". Builds the STAGING flavor of the app — bundle id
# com.reacti.app.staging, name "Reacti Staging", pointed at
# https://staging.reacti.io — and uploads it to TestFlight, where it installs
# ALONGSIDE the production app. Never touches production.
#
# Requires these repo secrets (all set 2026-05-30):
#   IOS_DIST_CERT_P12              base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD         the .p12 export password
#   IOS_PROVISIONING_PROFILE       base64 of the "Reacti Staging App Store" profile
#   APPSTORE_CONNECT_KEY_ID        App Store Connect API key id
#   APPSTORE_CONNECT_ISSUER_ID     App Store Connect API issuer id
#   APPSTORE_CONNECT_API_PRIVATE_KEY  contents of the AuthKey_*.p8
on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.x'
  STAGING_BASE_URL: 'https://staging.reacti.io/api'

jobs:
  staging-testflight:
    name: Build staging & upload to TestFlight
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      # Activate the staging flavor (bundle id, name, icon, signing) by dropping
      # the staging override next to AppIdentity.xcconfig. Production builds
      # never do this, so they keep the production identity and signing.
      - name: Activate staging flavor
        run: |
          cp ios/Flutter/FlavorOverride.staging.xcconfig ios/Flutter/FlavorOverride.xcconfig
          echo "Active flavor override:"; cat ios/Flutter/FlavorOverride.xcconfig

      # Import the Apple Distribution certificate into an ephemeral keychain.
      - name: Install signing certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "ci-keychain-pwd" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "ci-keychain-pwd" "$KEYCHAIN" >/dev/null

      # Install the provisioning profile in both locations Xcode 15/16 read.
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for DIR in \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$DIR"
            echo "$IOS_PROVISIONING_PROFILE" | base64 --decode \
              > "$DIR/reacti_staging.mobileprovision"
          done

      - name: Build signed staging IPA
        run: |
          flutter build ipa --release \
            --dart-define=BASE_URL=$STAGING_BASE_URL \
            --dart-define=APP_KEY_VALUE=staging-testflight \
            --export-options-plist=ios/ExportOptions-staging.plist

      # Place the App Store Connect API key where xcrun altool looks for it.
      - name: Install App Store Connect API key
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPSTORE_CONNECT_API_PRIVATE_KEY" \
            > "$KEY_DIR/AuthKey_${APPSTORE_CONNECT_KEY_ID}.p8"

      - name: Upload to TestFlight
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(ls build/ios/ipa/*.ipa | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$APPSTORE_CONNECT_KEY_ID" \
            --apiIssuer "$APPSTORE_CONNECT_ISSUER_ID"

      - name: Upload IPA as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reacti-staging-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn
